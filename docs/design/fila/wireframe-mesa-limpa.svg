<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <title>Fila — mesa limpa</title>
  <style>
    text { font-family: "Helvetica Neue", Arial, sans-serif; fill: #111; }
    .t { font-size: 15px; font-weight: 700; }
    .p { font-size: 12px; font-weight: 700; }
    .d { font-size: 11px; fill: #444; }
    .s { font-size: 9px; fill: #666; letter-spacing: .6px; }
    .n { font-size: 12px; font-weight: 700; fill: #fff; }
    .b { fill: none; stroke: #555; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .ff { fill: #f2f2f2; stroke: #555; stroke-width: 1; }
    .sk { fill: #e6e6e6; }
  </style>
<rect x="0" y="0" width="390" height="844" fill="#fff" stroke="#bbb"/>
<text x="14" y="22" class="t">ATALAIA · FILA · «MESA LIMPA?»</text>
<text x="14" y="37" class="d">modo «com confirmação» · contagem configurável</text>
<rect x="12" y="52" width="366" height="780" rx="10" class="b"/><circle cx="26" cy="66" r="9" fill="#111"/><text x="26" y="70" text-anchor="middle" class="n">1</text><text x="42" y="70" class="s">FUNDO ESCURECIDO</text>
<text x="24" y="80" class="s">O ECRÃ DA FILA FICA VISÍVEL ATRÁS, SEM INTERAÇÃO</text>
<rect x="32" y="200" width="326" height="470" rx="16" fill="#fff" stroke="#555" stroke-width="1.6" stroke-dasharray="6 4"/>
<circle cx="48" cy="216" r="9" fill="#111"/><text x="48" y="220" text-anchor="middle" class="n">2</text>
<text x="64" y="220" class="s">CARTÃO DE CONFIRMAÇÃO</text>
<text x="52" y="266" style="font-size:18px;font-weight:700">Mesa limpa?</text>
<text x="52" y="288" class="d">A impressão anterior terminou.</text>
<circle cx="48" cy="314" r="9" fill="#111"/><text x="48" y="318" text-anchor="middle" class="n">3</text>
<text x="64" y="318" class="s">ITEM E IMPRESSORA</text>
<rect x="52" y="330" width="56" height="56" rx="8" fill="#f2f2f2" stroke="#555" stroke-width="1" stroke-dasharray="4 4"/><text x="80.0" y="361.0" text-anchor="middle" class="s">MINI</text>
<text x="120" y="350" class="p">peca_2.gcode</text>
<text x="120" y="368" class="d">Centauri Carbon · 45m</text>
<circle cx="48" cy="410" r="9" fill="#111"/><text x="48" y="414" text-anchor="middle" class="n">4</text>
<text x="64" y="414" class="s">CONTAGEM DECRESCENTE</text>
<circle cx="90" cy="470" r="34" fill="none" stroke="#555" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="90" y="476" text-anchor="middle" style="font-size:16px;font-weight:700">60</text>
<text x="140" y="462" class="d">segundos</text>
<text x="140" y="480" class="s">CONFIGURÁVEL · 15 A 120 s</text>
<circle cx="48" cy="524" r="9" fill="#111"/><text x="48" y="528" text-anchor="middle" class="n">5</text>
<text x="64" y="528" class="s">AÇÃO PRIMÁRIA</text>
<rect x="52" y="540" width="286" height="48" rx="8" fill="#e6e6e6" stroke="#555" stroke-width="1.2"/><text x="195.0" y="568.0" text-anchor="middle" style="font-size:12px;fill:#333">MESA LIMPA — ARRANCAR</text>
<circle cx="48" cy="606" r="9" fill="#111"/><text x="48" y="610" text-anchor="middle" class="n">6</text>
<text x="64" y="610" class="s">CANCELAR</text>
<rect x="52" y="620" width="286" height="40" rx="8" fill="none" stroke="#555" stroke-width="1.2"/><text x="195.0" y="644.0" text-anchor="middle" style="font-size:11px;fill:#333">Cancelar</text>
<rect x="12" y="690" width="366" height="142" rx="10" class="b"/><circle cx="26" cy="704" r="9" fill="#111"/><text x="26" y="708" text-anchor="middle" class="n">7</text><text x="42" y="708" class="s">REGRA DA CONTAGEM</text>
<text x="24" y="730" class="d">No fim da contagem NÃO arranca:</text>
<text x="24" y="748" class="d">o item fica «à espera de mesa limpa».</text>
<text x="24" y="766" class="d">Só o toque confirma a mesa.</text>
<text x="24" y="784" class="d">Fechar a app desfaz o pedido.</text>
<text x="24" y="812" class="s">A CONFIRMAÇÃO NÃO SUBSTITUI O ACK DA IMPRESSORA</text>
</svg>
