<svg xmlns="http://www.w3.org/2000/svg" width="390" height="888" viewBox="0 0 390 888">
  <title>Ficheiros — receber</title>
  <style>
    text { font-family: "Helvetica Neue", Arial, sans-serif; fill: #111; }
    .t { font-size: 13px; font-weight: 700; }
    .d { font-size: 11px; fill: #444; }
    .s { font-size: 9px; fill: #666; letter-spacing: .6px; }
    .n { font-size: 12px; font-weight: 700; fill: #fff; }
    .b { fill: none; stroke: #555; stroke-width: 1.2; stroke-dasharray: 5 4; }
  </style>
<rect x="0" y="44" width="390" height="844" fill="#fff" stroke="#bbb"/>
<text x="14" y="24" class="t">ATALAIA · RECEBER POR «PARTILHAR»</text>
<text x="14" y="38" class="d">receber → escolher → confirmar → enviar → fim ou erro</text>
<rect x="12" y="58" width="366" height="92" rx="10" class="b"/><circle cx="26" cy="72" r="9" fill="#111"/><text x="26" y="76" text-anchor="middle" class="n">1</text><text x="42" y="76" class="s">FICHEIRO RECEBIDO</text><rect x="26" y="90" width="52" height="52" rx="8" fill="#f7f7f7" stroke="#555" stroke-width="1" stroke-dasharray="4 4"/><text x="52.0" y="119.0" text-anchor="middle" class="s"></text><text x="92" y="110" class="d" style="font-weight:700">peça.gcode</text><text x="92" y="128" class="d">12,4 MB · G-code</text>
<rect x="12" y="162" width="366" height="132" rx="10" class="b"/><circle cx="26" cy="176" r="9" fill="#111"/><text x="26" y="180" text-anchor="middle" class="n">2</text><text x="42" y="180" class="s">ESCOLHER IMPRESSORA</text><rect x="26" y="184" width="338" height="56" rx="8" fill="#f2f2f2"/><circle cx="346" cy="212" r="8" fill="#555"/><text x="42" y="204" class="d" style="font-weight:700">Centauri Carbon</text><text x="42" y="222" class="s">COMPATÍVEL · 192.168.1.7</text><text x="26" y="266" class="d" opacity=".45">Saturn 3 Ultra · .gcode não abre</text><rect x="26" y="250" width="338" height="34" rx="8" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="12" y="306" width="366" height="90" rx="10" class="b"/><circle cx="26" cy="320" r="9" fill="#111"/><text x="26" y="324" text-anchor="middle" class="n">3</text><text x="42" y="324" class="s">CONFIRMAÇÃO</text><text x="26" y="336" class="d">Enviar para Centauri Carbon?</text><rect x="26" y="348" width="158" height="36" rx="8" fill="none" stroke="#555" stroke-width="1.2"/><text x="105.0" y="370.0" text-anchor="middle" class="d">Cancelar</text><rect x="194" y="348" width="158" height="36" rx="8" fill="#e8e8e8" stroke="#555" stroke-width="1.2"/><text x="273.0" y="370.0" text-anchor="middle" class="d">Enviar</text>
<rect x="12" y="408" width="366" height="74" rx="10" class="b"/><circle cx="26" cy="422" r="9" fill="#111"/><text x="26" y="426" text-anchor="middle" class="n">4</text><text x="42" y="426" class="s">PROGRESSO</text><rect x="26" y="442" width="250" height="8" rx="4.0" fill="#e6e6e6"/><text x="26" y="466" class="d">A enviar · 46%</text><rect x="300" y="440" width="64" height="28" rx="8" fill="none" stroke="#555" stroke-width="1.2"/><text x="332.0" y="458.0" text-anchor="middle" class="d">Parar</text>
<rect x="12" y="486" width="366" height="76" rx="10" class="b"/><circle cx="26" cy="500" r="9" fill="#111"/><text x="26" y="504" text-anchor="middle" class="n">5</text><text x="42" y="504" class="s">ERRO</text><text x="26" y="516" class="d">Rede caiu a meio. Ficheiro incompleto.</text><rect x="26" y="524" width="120" height="30" rx="8" fill="none" stroke="#555" stroke-width="1.2"/><text x="86.0" y="543.0" text-anchor="middle" class="d">Tentar de novo</text><rect x="154" y="524" width="120" height="30" rx="8" fill="none" stroke="#555" stroke-width="1.2"/><text x="214.0" y="543.0" text-anchor="middle" class="d">Escolher outra</text>
<rect x="12" y="572" width="366" height="58" rx="10" class="b"/><circle cx="26" cy="586" r="9" fill="#111"/><text x="26" y="590" text-anchor="middle" class="n">6</text><text x="42" y="590" class="s">AVISO DE TAMANHO</text><text x="26" y="602" class="d">Ficheiro grande (120 MB): aviso antes.</text><text x="26" y="620" class="s">NUNCA UMA BARRA SILENCIOSA</text>
<rect x="12" y="640" width="366" height="44" rx="10" class="b"/><circle cx="26" cy="654" r="9" fill="#111"/><text x="26" y="658" text-anchor="middle" class="n">7</text><text x="42" y="658" class="s">LIMPEZA</text><text x="26" y="668" class="d">No fim: temporários apagados, lista actualizada.</text>
</svg>
