<svg viewBox="0 0 1180 740" width="1180" height="740" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect width="1180" height="740" fill="#090A0F"/>

  <!-- Tablet Header -->
  <rect x="0" y="0" width="1180" height="64" fill="#12141C"/>
  <path d="M 28 32 L 38 22 M 28 32 L 38 42" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  <text x="54" y="38" fill="#F8FAFC" font-size="20" font-weight="700">Fatiador 3D Integrado • Elegoo Centauri Carbon (Klipper/COSMOS)</text>
  <rect x="1060" y="18" width="90" height="28" rx="6" fill="#1E2330"/>
  <text x="1105" y="36" fill="#38BDF8" font-size="12" font-weight="600" text-anchor="middle">COSMOS AFC</text>

  <!-- Left Column: 3D Model Card & 3D Viewport placeholder -->
  <g transform="translate(32, 88)">
    <rect x="0" y="0" width="540" height="620" rx="16" fill="#12151E" stroke="#1E2330" stroke-width="1"/>
    
    <!-- 3D Canvas / Viewport Area -->
    <rect x="16" y="16" width="508" height="460" rx="12" fill="#0A0C12" stroke="#181D29" stroke-width="1"/>
    <!-- Grid bed representation -->
    <path d="M 60 380 L 270 450 L 460 380 L 270 310 Z" fill="#151A26" stroke="#252D3D" stroke-width="1.5"/>
    <path d="M 165 345 L 365 415 M 112 362 L 312 432 M 217 327 L 417 397" stroke="#1C2433" stroke-width="1"/>
    <!-- STL bounding box representation -->
    <rect x="220" y="220" width="100" height="150" fill="#2563EB" opacity="0.2" rx="4"/>
    <rect x="220" y="220" width="100" height="150" fill="none" stroke="#38BDF8" stroke-width="2" rx="4"/>
    <text x="270" y="300" fill="#38BDF8" font-size="14" font-weight="600" text-anchor="middle">suporte_cabo_cc1.stl</text>
    
    <!-- Model Meta Info -->
    <g transform="translate(20, 500)">
      <text x="0" y="24" fill="#F8FAFC" font-size="16" font-weight="600">suporte_cabo_cc1.stl</text>
      <text x="0" y="46" fill="#94A3B8" font-size="13">14.2 MB • Dimensões: 45.0 × 32.4 × 68.0 mm • 182,410 triângulos</text>
      <rect x="0" y="64" width="140" height="36" rx="8" fill="#1E2433"/>
      <text x="70" y="87" fill="#38BDF8" font-size="13" font-weight="600" text-anchor="middle">Trocar Modelo</text>
    </g>
  </g>

  <!-- Right Column: Slicing Configuration & Canvas MMU -->
  <g transform="translate(604, 88)">
    <rect x="0" y="0" width="544" height="620" rx="16" fill="#12151E" stroke="#1E2330" stroke-width="1"/>

    <!-- Profile Selection -->
    <text x="28" y="40" fill="#94A3B8" font-size="12" font-weight="700" letter-spacing="0.5">PERFIL DA IMPRESSORA</text>
    <rect x="28" y="52" width="488" height="52" rx="10" fill="#181D2A" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="50" cy="78" r="6" fill="#38BDF8"/>
    <text x="68" y="74" fill="#F8FAFC" font-size="15" font-weight="600">Centauri Carbon 0.4 — Cosmos AFC</text>
    <text x="68" y="90" fill="#38BDF8" font-size="12">Klipper + Moonraker + Módulo Canvas de 4 Canais</text>

    <!-- Canvas AFC Multi-color Slots -->
    <text x="28" y="136" fill="#94A3B8" font-size="12" font-weight="700" letter-spacing="0.5">RANHURA ATIVA NO MÓDULO CANVAS (AFC)</text>
    <g transform="translate(28, 148)">
      <rect x="0" y="0" width="114" height="70" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
      <circle cx="24" cy="24" r="8" fill="#EF4444"/>
      <text x="40" y="29" fill="#F8FAFC" font-size="14" font-weight="700">T0 (Ativo)</text>
      <text x="14" y="52" fill="#94A3B8" font-size="12">PLA Preto</text>

      <rect x="124" y="0" width="114" height="70" rx="10" fill="#181D2A" stroke="#252D3D" stroke-width="1"/>
      <circle cx="148" cy="24" r="8" fill="#FFFFFF"/>
      <text x="164" y="29" fill="#94A3B8" font-size="14" font-weight="700">T1</text>
      <text x="138" y="52" fill="#64748B" font-size="12">PLA Branco</text>

      <rect x="248" y="0" width="114" height="70" rx="10" fill="#181D2A" stroke="#252D3D" stroke-width="1"/>
      <circle cx="272" cy="24" r="8" fill="#3B82F6"/>
      <text x="288" y="29" fill="#94A3B8" font-size="14" font-weight="700">T2</text>
      <text x="262" y="52" fill="#64748B" font-size="12">PETG Azul</text>

      <rect x="372" y="0" width="116" height="70" rx="10" fill="#181D2A" stroke="#252D3D" stroke-width="1"/>
      <circle cx="396" cy="24" r="8" fill="#EAB308"/>
      <text x="412" y="29" fill="#94A3B8" font-size="14" font-weight="700">T3</text>
      <text x="386" y="52" fill="#64748B" font-size="12">ABS Laranja</text>
    </g>

    <!-- Slicing Settings Grid -->
    <text x="28" y="252" fill="#94A3B8" font-size="12" font-weight="700" letter-spacing="0.5">PARÂMETROS DE FATIAMENTO</text>
    
    <!-- Layer Height -->
    <rect x="28" y="264" width="488" height="44" rx="8" fill="#181D2A" stroke="#252D3D" stroke-width="1"/>
    <rect x="175" y="268" width="156" height="36" rx="6" fill="#2563EB"/>
    <text x="100" y="291" fill="#94A3B8" font-size="13" text-anchor="middle">0.12 mm Fina</text>
    <text x="253" y="291" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle">0.20 mm Standard</text>
    <text x="410" y="291" fill="#94A3B8" font-size="13" text-anchor="middle">0.28 mm Rápida</text>

    <!-- Row Infill & Supports -->
    <g transform="translate(28, 324)">
      <rect x="0" y="0" width="236" height="64" rx="8" fill="#181D2A" stroke="#252D3D" stroke-width="1"/>
      <text x="16" y="26" fill="#94A3B8" font-size="11">PREENCHIMENTO (INFILL)</text>
      <text x="16" y="50" fill="#F8FAFC" font-size="15" font-weight="600">15% Gyroid</text>

      <rect x="252" y="0" width="236" height="64" rx="8" fill="#181D2A" stroke="#252D3D" stroke-width="1"/>
      <text x="268" y="26" fill="#94A3B8" font-size="11">GERAÇÃO DE SUPORTES</text>
      <text x="268" y="50" fill="#F8FAFC" font-size="15" font-weight="600">Árvore (Tree - Auto)</text>
    </g>

    <!-- Print Stats Estimation -->
    <rect x="28" y="408" width="488" height="74" rx="12" fill="#0E121A" stroke="#1E2330" stroke-width="1"/>
    <g transform="translate(48, 432)">
      <text x="0" y="0" fill="#94A3B8" font-size="12">Tempo previsto</text>
      <text x="0" y="28" fill="#38BDF8" font-size="22" font-weight="700">~ 1h 42m</text>

      <text x="170" y="0" fill="#94A3B8" font-size="12">Filamento estimado</text>
      <text x="170" y="28" fill="#F8FAFC" font-size="20" font-weight="600">38g • 12.4m</text>

      <text x="340" y="0" fill="#94A3B8" font-size="12">Camadas totais</text>
      <text x="340" y="28" fill="#F8FAFC" font-size="20" font-weight="600">340 camadas</text>
    </g>

    <!-- CTAs -->
    <g transform="translate(28, 510)">
      <rect x="0" y="0" width="488" height="54" rx="12" fill="#2563EB"/>
      <text x="244" y="33" fill="#FFFFFF" font-size="16" font-weight="700" text-anchor="middle">Fatiar e Iniciar Impressão no COSMOS</text>

      <rect x="0" y="64" width="488" height="44" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>
      <text x="244" y="91" fill="#94A3B8" font-size="14" font-weight="600" text-anchor="middle">Apenas Fatiar e Guardar G-code Local</text>
    </g>
  </g>
</svg>
