<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <style>
      .screen-bg { fill: #f8f9fa; stroke: #adb5bd; stroke-width: 2; }
      .header-bg { fill: #ffffff; stroke: #dee2e6; stroke-width: 1; }
      .header-title { font-size: 15px; font-weight: 700; fill: #212529; }
      .block-box { fill: #ffffff; stroke: #6c757d; stroke-width: 1.5; stroke-dasharray: 4; }
      .solid-box { fill: #ffffff; stroke: #495057; stroke-width: 1.5; }
      .label-num { font-size: 12px; font-weight: 700; fill: #495057; }
      .text-title { font-size: 13px; font-weight: 700; fill: #212529; }
      .text-body { font-size: 12px; fill: #495057; }
      .text-sub { font-size: 12px; fill: #6c757d; }
      .btn-primary { fill: #212529; rx: 8px; }
      .btn-primary-text { font-size: 14px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .btn-secondary { fill: #ffffff; stroke: #495057; stroke-width: 1.5; rx: 8px; }
      .btn-secondary-text { font-size: 13px; font-weight: 600; fill: #343a40; text-anchor: middle; }
      .chevron { fill: none; stroke: #495057; stroke-width: 2; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="390" height="844" rx="14" class="screen-bg"/>
  <rect width="390" height="56" rx="14" class="header-bg"/>
  <text x="20" y="35" class="header-title">[E1] CONFIGURAR FATIAMENTO</text>

  <!-- [1] Modelo e Ficheiro -->
  <rect x="15" y="68" width="360" height="64" rx="8" class="solid-box"/>
  <text x="25" y="88" class="label-num">[1] MODELO SELECIONADO</text>
  <text x="25" y="106" class="text-title">suporte_cabo_cc1.stl</text>
  <text x="25" y="122" class="text-sub">14.2 MB • 45 × 32 × 68 mm (Toque para trocar)</text>
  <path d="M 355 96 L 361 100 L 355 104" class="chevron"/>

  <!-- [2] Seletor de Perfil (>= 48px cada opção) -->
  <rect x="15" y="142" width="360" height="184" rx="8" class="block-box"/>
  <text x="25" y="162" class="label-num">[2] SELETOR DE PERFIL DE MÁQUINA</text>

  <!-- Cosmos AFC (Selecionado) - Altura: 48px -->
  <rect x="25" y="172" width="340" height="48" rx="6" fill="#e9ecef" stroke="#212529" stroke-width="1.5"/>
  <circle cx="42" cy="196" r="6" fill="#212529"/>
  <text x="56" y="191" class="text-title">Cosmos AFC (0.4 nozzle)</text>
  <text x="56" y="209" class="text-sub">Klipper + multi-cor Canvas (pistas T0..T3)</text>

  <!-- Cosmos Mono - Altura: 48px -->
  <rect x="25" y="226" width="340" height="48" rx="6" fill="#ffffff" stroke="#ced4da" stroke-width="1"/>
  <circle cx="42" cy="250" r="6" fill="none" stroke="#6c757d" stroke-width="1.5"/>
  <text x="56" y="245" class="text-body">Cosmos Mono (0.4 nozzle)</text>
  <text x="56" y="263" class="text-sub">Klipper mono-extrusão convencional</text>

  <!-- OpenCentauri - Altura: 48px -->
  <rect x="25" y="280" width="340" height="48" rx="6" fill="#ffffff" stroke="#ced4da" stroke-width="1"/>
  <circle cx="42" cy="304" r="6" fill="none" stroke="#6c757d" stroke-width="1.5"/>
  <text x="56" y="299" class="text-body">OpenCentauri (0.4 nozzle)</text>
  <text x="56" y="317" class="text-sub">Variante comunitária Klipper</text>

  <!-- [3] Ranhura Canvas AFC -->
  <rect x="15" y="336" width="360" height="154" rx="8" class="block-box"/>
  <text x="25" y="356" class="label-num">[3] RANHURA CANVAS AFC</text>
  <text x="25" y="372" class="text-sub">Depende de: Perfil Cosmos AFC ativo</text>
  <g transform="translate(25, 380)">
    <!-- T0 Ativo -->
    <rect x="0" y="0" width="76" height="50" rx="6" fill="#212529" stroke="#212529" stroke-width="1.5"/>
    <circle cx="16" cy="18" r="5" fill="#ffffff"/>
    <text x="26" y="22" font-size="12" font-weight="700" fill="#ffffff">T0</text>
    <text x="8" y="40" font-size="12" fill="#e9ecef">Preto (PLA)</text>

    <!-- T1 -->
    <rect x="84" y="0" width="76" height="50" rx="6" fill="#ffffff" stroke="#ced4da" stroke-width="1"/>
    <circle cx="100" cy="18" r="5" fill="#ced4da"/>
    <text x="110" y="22" font-size="12" font-weight="700" fill="#495057">T1</text>
    <text x="92" y="40" font-size="12" fill="#6c757d">Branco</text>

    <!-- T2 -->
    <rect x="168" y="0" width="76" height="50" rx="6" fill="#ffffff" stroke="#ced4da" stroke-width="1"/>
    <circle cx="184" cy="18" r="5" fill="#ced4da"/>
    <text x="194" y="22" font-size="12" font-weight="700" fill="#495057">T2</text>
    <text x="176" y="40" font-size="12" fill="#6c757d">Azul</text>

    <!-- T3 -->
    <rect x="252" y="0" width="76" height="50" rx="6" fill="#ffffff" stroke="#ced4da" stroke-width="1"/>
    <circle cx="268" cy="18" r="5" fill="#ced4da"/>
    <text x="278" y="22" font-size="12" font-weight="700" fill="#495057">T3</text>
    <text x="260" y="40" font-size="12" fill="#6c757d">Laranja</text>
  </g>
  <!-- Botão visível Escolher Manualmente (>= 48px) -->
  <rect x="25" y="436" width="340" height="48" rx="6" fill="#ffffff" stroke="#495057" stroke-width="1.2"/>
  <text x="195" y="465" font-size="13" font-weight="600" fill="#212529" text-anchor="middle">ESCOLHER MANUALMENTE (T0..T3 / COR)</text>

  <!-- [4] Parâmetros de Impressão -->
  <rect x="15" y="500" width="360" height="152" rx="8" class="solid-box"/>
  <text x="25" y="520" class="label-num">[4] PARÂMETROS BÁSICOS DE IMPRESSÃO</text>
  
  <rect x="25" y="530" width="340" height="48" rx="6" fill="#f1f3f5" stroke="#ced4da" stroke-width="1"/>
  <rect x="135" y="534" width="120" height="40" rx="5" fill="#212529"/>
  <text x="75" y="558" class="text-body" text-anchor="middle">0.12</text>
  <text x="195" y="558" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">0.20 Standard</text>
  <text x="305" y="558" class="text-body" text-anchor="middle">0.28</text>

  <rect x="25" y="586" width="164" height="52" rx="6" fill="#ffffff" stroke="#ced4da" stroke-width="1"/>
  <text x="35" y="606" class="text-sub">INFILL (Toque)</text>
  <text x="35" y="626" class="text-title">15% Gyroid</text>
  <path d="M 175 610 L 181 614 L 175 618" class="chevron"/>

  <rect x="201" y="586" width="164" height="52" rx="6" fill="#ffffff" stroke="#ced4da" stroke-width="1"/>
  <text x="211" y="606" class="text-sub">SUPORTES (Toque)</text>
  <text x="211" y="626" class="text-title">Árvore (Tree)</text>
  <path d="M 351 610 L 357 614 L 351 618" class="chevron"/>

  <!-- [5] Estimativa Pré-Fatiamento -->
  <rect x="15" y="660" width="360" height="56" rx="8" class="solid-box"/>
  <text x="25" y="680" class="label-num">[5] ESTIMATIVA (Calculada após fatiamento)</text>
  <text x="25" y="700" font-size="14" font-weight="700" fill="#495057">Tempo: —</text>
  <text x="200" y="700" font-size="14" font-weight="700" fill="#495057">Filamento: —</text>

  <!-- [6] Ações: Visualizar Modelo e Fatiar -->
  <rect x="15" y="724" width="360" height="48" class="btn-secondary"/>
  <text x="195" y="754" class="btn-secondary-text">VISUALIZAR MODELO 3D (VOLUME)</text>

  <rect x="15" y="778" width="360" height="52" class="btn-primary"/>
  <text x="195" y="810" class="btn-primary-text">[6] FATIAR</text>

  <!-- Modal 3MF Multi-Cor: Confirmação Explícita de Ranhura Única (Req 3h) -->
  <rect x="15" y="520" width="360" height="250" rx="10" fill="#ffffff" stroke="#212529" stroke-width="2"/>
  <text x="28" y="546" font-size="13" font-weight="700" fill="#d9480f">3MF MULTI-COR DETETADO</text>
  <text x="28" y="568" class="text-body">O ficheiro carregado contém 3 cores definidas.</text>
  <text x="28" y="586" class="text-body">Na versão v1, o mapeamento por cor está fora de âmbito;</text>
  <text x="28" y="604" class="text-body">o modelo será impresso integralmente na ranhura T0 (Preto).</text>
  <text x="28" y="626" font-size="12" font-weight="700" fill="#212529">Pretendes continuar com fatiamento mono-ranhura?</text>

  <rect x="25" y="644" width="140" height="48" rx="6" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>
  <text x="95" y="673" font-size="13" font-weight="600" fill="#343a40" text-anchor="middle">CANCELAR</text>

  <rect x="175" y="644" width="190" height="48" class="btn-primary"/>
  <text x="270" y="673" class="btn-primary-text">CONTINUAR EM T0</text>
  <text x="28" y="710" class="text-sub">Mapeamento cor-a-ranhura Canvas planeado para a v2.</text>
</svg>
