<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <style>
      .screen-bg { fill: #f8f9fa; stroke: #adb5bd; stroke-width: 2; }
      .header-bg { fill: #ffffff; stroke: #dee2e6; stroke-width: 1; }
      .header-title { font-size: 15px; font-weight: 700; fill: #212529; }
      .solid-box { fill: #ffffff; stroke: #495057; stroke-width: 1.5; }
      .label-num { font-size: 12px; font-weight: 700; fill: #495057; }
      .text-title { font-size: 13px; font-weight: 700; fill: #212529; }
      .text-body { font-size: 12px; fill: #495057; }
      .text-sub { font-size: 12px; fill: #6c757d; }
      .btn-primary { fill: #212529; rx: 8px; }
      .btn-primary-text { font-size: 14px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .btn-secondary { fill: #ffffff; stroke: #495057; stroke-width: 1.5; rx: 8px; }
      .btn-secondary-text { font-size: 13px; font-weight: 600; fill: #343a40; text-anchor: middle; }
    </style>
  </defs>

  <rect width="390" height="844" rx="14" class="screen-bg"/>
  <rect width="390" height="56" rx="14" class="header-bg"/>
  <text x="20" y="35" class="header-title">[E4] RESULTADO DO FATIAMENTO</text>

  <!-- [11] Vista 2D de Camadas -->
  <rect x="15" y="66" width="360" height="184" rx="8" class="solid-box"/>
  <rect x="25" y="76" width="340" height="126" rx="6" fill="#212529"/>
  <path d="M 90 155 L 170 100 L 260 110 L 280 165 L 200 185 Z" fill="none" stroke="#ced4da" stroke-width="2"/>
  <path d="M 110 150 L 170 115 L 245 122 L 260 160 L 200 175 Z" fill="none" stroke="#6c757d" stroke-width="1.5"/>
  <text x="35" y="96" font-size="12" font-weight="700" fill="#ffffff">[11] PRÉ-VISUALIZAÇÃO 2D</text>
  <text x="35" y="190" font-size="12" fill="#adb5bd">Camada 142 de 340 (Z = 28.40 mm)</text>
  
  <!-- Slider de camadas (Touch target de 48px com barra e indicador) -->
  <rect x="25" y="200" width="340" height="48" rx="6" fill="#f8f9fa" stroke="#ced4da" stroke-width="1"/>
  <line x1="45" y1="224" x2="345" y2="224" stroke="#adb5bd" stroke-width="4" stroke-linecap="round"/>
  <circle cx="160" cy="224" r="10" fill="#212529"/>
  <text x="180" y="228" class="text-title">Camada 142/340</text>

  <!-- [12] Métricas Reais e Avisos de Perfil -->
  <rect x="15" y="258" width="360" height="174" rx="8" class="solid-box"/>
  <text x="25" y="278" class="label-num">[12] DADOS REAIS DO G-CODE GERADO</text>
  
  <text x="25" y="302" font-size="18" font-weight="700" fill="#212529">1h 48m</text>
  <text x="25" y="318" class="text-sub">Tempo estimado</text>

  <text x="145" y="302" font-size="18" font-weight="700" fill="#212529">42.6 g</text>
  <text x="145" y="318" class="text-sub">Filamento (13.8 m)</text>

  <text x="265" y="302" font-size="18" font-weight="700" fill="#212529">340</text>
  <text x="265" y="318" class="text-sub">Camadas totais</text>

  <!-- Aviso de Perfil (Req 1) -->
  <rect x="25" y="330" width="340" height="92" rx="6" fill="#fff9db" stroke="#f08c00" stroke-width="1"/>
  <text x="35" y="350" font-size="12" font-weight="700" fill="#b06200">PERFIL NÃO VERIFICADO NA IMPRESSORA:</text>
  <text x="35" y="368" class="text-body">Gerado com o perfil Cosmos AFC (não verificado</text>
  <text x="35" y="384" class="text-body">na impressora). Primeira impressão com perfil novo:</text>
  <text x="35" y="402" class="text-sub">vigia as primeiras camadas e valida o nivelamento da mesa.</text>

  <!-- [13] Ações do Fatiamento (>= 48px cada) -->
  <g transform="translate(15, 442)">
    <text x="10" y="16" class="label-num">[13] DESTINO DO G-CODE</text>

    <!-- Botão Enviar e Arrancar -->
    <rect x="0" y="26" width="360" height="52" class="btn-primary"/>
    <text x="180" y="48" class="btn-primary-text">ENVIAR E ARRANCAR</text>
    <text x="180" y="66" font-size="12" fill="#ced4da" text-anchor="middle">(Valida bloqueios da Fila + Mesa Limpa)</text>

    <!-- Pôr na Fila Local (Sem envio de rede imediato) -->
    <rect x="0" y="86" width="360" height="48" class="btn-secondary"/>
    <text x="180" y="116" class="btn-secondary-text">PÔR NA FILA LOCAL (SEM ENVIO IMEDIATO)</text>

    <!-- Apenas Upload -->
    <rect x="0" y="142" width="360" height="48" class="btn-secondary"/>
    <text x="180" y="172" class="btn-secondary-text">APENAS ENVIAR PARA COSMOS (UPLOAD)</text>

    <!-- Guardar G-code -->
    <rect x="0" y="198" width="360" height="48" class="btn-secondary"/>
    <text x="180" y="228" class="btn-secondary-text">GUARDAR FICHEIRO G-CODE LOCAL</text>
  </g>

  <!-- [14] Modal: Confirmação de Mesa Limpa + Bloqueios da Fila -->
  <rect x="15" y="546" width="360" height="284" rx="10" fill="#ffffff" stroke="#212529" stroke-width="2"/>
  <text x="28" y="570" font-size="13" font-weight="700" fill="#c92a2a">[14] CONFIRMAR ARRANQUE IMEDIATO</text>
  
  <text x="28" y="590" class="text-title">Ficheiro: suporte_cabo_cc1.gcode</text>
  <text x="28" y="606" class="text-body">• Perfil: Cosmos AFC • Ranhura: T0 (Preto / PLA)</text>
  <text x="28" y="622" class="text-body">• Duração estimada: 1h 48m (42.6 g)</text>

  <!-- Validação de Bloqueios da Fila (Linhas Quebradas Sem Passar da Caixa - Req 6) -->
  <rect x="25" y="632" width="340" height="118" rx="4" fill="#fff9db" stroke="#f08c00" stroke-width="1.2"/>
  <text x="35" y="650" font-size="12" font-weight="700" fill="#212529">VERIFICAÇÃO DE PRÉ-ARRANQUE:</text>
  <text x="35" y="668" class="text-body">• Impressora ociosa (revalidada antes de print.start)</text>
  <text x="35" y="686" font-size="12" font-weight="700" fill="#b06200">• ⚠ AVISO: Filamento estimado &gt; registado no rolo</text>
  <text x="35" y="702" class="text-sub">  (Apenas aviso informativo; não bloqueia o arranque)</text>
  <text x="35" y="720" class="text-body">• Confirmação: Mesa está 100% desobstruída e limpa?</text>

  <!-- Botões do Modal: Variante com Aviso Aceitável -->
  <rect x="25" y="760" width="140" height="52" class="btn-secondary"/>
  <text x="95" y="792" class="btn-secondary-text">CANCELAR</text>

  <!-- Botão Confirmar e Arrancar com revalidação imediata -->
  <rect x="175" y="760" width="190" height="52" class="btn-primary"/>
  <text x="270" y="792" class="btn-primary-text">CONFIRMAR E ARRANCAR</text>
</svg>
