<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <style>
      .screen-bg { fill: #f8f9fa; stroke: #adb5bd; stroke-width: 2; }
      .header-bg { fill: #ffffff; stroke: #dee2e6; stroke-width: 1; }
      .header-title { font-size: 15px; font-weight: 700; fill: #212529; }
      .solid-box { fill: #ffffff; stroke: #495057; stroke-width: 1.5; }
      .label-num { font-size: 12px; font-weight: 700; fill: #495057; }
      .text-title { font-size: 13px; font-weight: 700; fill: #212529; }
      .text-body { font-size: 12px; fill: #495057; }
      .text-sub { font-size: 12px; fill: #6c757d; }
      .btn-primary { fill: #212529; rx: 8px; }
      .btn-primary-text { font-size: 14px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .btn-secondary { fill: #ffffff; stroke: #495057; stroke-width: 1.5; rx: 8px; }
      .btn-secondary-text { font-size: 13px; font-weight: 600; fill: #343a40; text-anchor: middle; }
      .btn-danger { fill: #ffffff; stroke: #c92a2a; stroke-width: 1.5; rx: 8px; }
      .btn-danger-text { font-size: 13px; font-weight: 700; fill: #c92a2a; text-anchor: middle; }
    </style>
  </defs>

  <rect width="390" height="844" rx="14" class="screen-bg"/>
  <rect width="390" height="56" rx="14" class="header-bg"/>
  <text x="20" y="35" class="header-title">[E5] UPLOAD PARA O MOONRAKER</text>

  <!-- [15] Painel de Upload -->
  <rect x="15" y="70" width="360" height="230" rx="10" class="solid-box"/>
  <text x="25" y="95" class="label-num">[15] ENVIO HTTP MULTIPART</text>
  <text x="25" y="112" class="text-sub">Destino: POST http://192.168.1.5:80/server/files/upload</text>
  <text x="25" y="128" class="text-sub">Depende de: porta 80 do Moonraker no COSMOS</text>

  <text x="195" y="172" font-size="36" font-weight="700" fill="#212529" text-anchor="middle">74%</text>
  
  <rect x="35" y="190" width="320" height="12" rx="6" fill="#e9ecef"/>
  <rect x="35" y="190" width="236" height="12" rx="6" fill="#212529"/>

  <text x="195" y="222" class="text-title" text-anchor="middle">A transferir suporte_cabo_cc1.gcode</text>
  <text x="195" y="240" class="text-sub" text-anchor="middle">5.8 MB de 7.9 MB (1.8 MB/s)</text>

  <!-- Botão Cancelar com Limpeza -->
  <rect x="35" y="254" width="320" height="48" class="btn-danger"/>
  <text x="195" y="284" class="btn-danger-text">CANCELAR (LIMPA FICHEIRO PARCIAL)</text>

  <!-- [15B] Estado: Apenas Enviado (Req 2) -->
  <rect x="15" y="312" width="360" height="150" rx="8" fill="#ebfbee" stroke="#40c057" stroke-width="1.5"/>
  <text x="25" y="334" font-size="12" font-weight="700" fill="#2b8a3e">ESTADO: APENAS ENVIADO (FICHEIRO NO MOONRAKER)</text>
  <text x="25" y="352" class="text-body">Ficheiro guardado com sucesso na Centauri Carbon.</text>
  <text x="25" y="368" class="text-sub">Sem arranque automático. O que pretendes fazer?</text>
  
  <!-- Ações pós-envio (Botões manuais sem redirecionamento de 3s) -->
  <rect x="25" y="380" width="165" height="48" class="btn-primary"/>
  <text x="107" y="410" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">ARRANCAR AGORA</text>
  <text x="107" y="422" font-size="10" fill="#ced4da" text-anchor="middle">(MESA LIMPA)</text>

  <rect x="200" y="380" width="165" height="48" class="btn-secondary"/>
  <text x="282" y="410" font-size="13" font-weight="600" fill="#343a40" text-anchor="middle">CONCLUIR</text>

  <!-- [16] Falhas e Bloqueios Tratados no Envio (Req 3) -->
  <rect x="15" y="474" width="360" height="250" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="1.5"/>
  <text x="25" y="496" font-size="12" font-weight="700" fill="#b06200">[16] ERROS E BLOQUEIOS TRATADOS NO ENVIO:</text>
  
  <!-- Impressora ocupada ou revalidação falhada -->
  <text x="25" y="516" font-size="12" font-weight="700" fill="#212529">• REVALIDAÇÃO PRÉ-ARRANQUE / OCUPADA:</text>
  <text x="25" y="532" class="text-body">A máquina começou outra impressão antes de print.start.</text>
  <text x="25" y="546" class="text-sub">Ficheiro mantido no Moonraker; arranque direto cancelado.</text>

  <!-- Autenticação falhada -->
  <text x="25" y="566" font-size="12" font-weight="700" fill="#212529">• AUTENTICAÇÃO FALHADA (401/403):</text>
  <text x="25" y="582" class="text-sub">Depende de: Moonraker exigir token ou chave API.</text>

  <!-- Espaço insuficiente e Timeout com remoção parcial e aviso -->
  <text x="25" y="602" font-size="12" font-weight="700" fill="#212529">• TIMEOUT DE REDE / SEM ESPAÇO (HTTP 507):</text>
  <text x="25" y="618" class="text-body">Tenta remover o ficheiro parcial; se falhar, avisa.</text>
  <text x="25" y="632" class="text-sub">Depende de: resposta HTTP 507 e espaço eMMC na impressora.</text>

  <!-- Falha de print.start -->
  <text x="25" y="652" font-size="12" font-weight="700" fill="#c92a2a">• FALHA NO PRINT.START (KLIPPER RECUSOU):</text>
  <text x="25" y="668" class="text-body">Upload concluído, mas macro PRINT_START falhou.</text>
  <text x="25" y="682" class="text-sub">Ficheiro guardado; utilizador pode arrancar manualmente.</text>

  <!-- Ações de Recuperação -->
  <g transform="translate(15, 736)">
    <rect x="0" y="0" width="174" height="48" class="btn-primary"/>
    <text x="87" y="30" class="btn-primary-text">TENTAR NOVO</text>

    <rect x="186" y="0" width="174" height="48" class="btn-secondary"/>
    <text x="273" y="30" class="btn-secondary-text">PÔR NA FILA</text>
  </g>
</svg>
