<rect x="24" y="386" width="556" height="150" rx="10" class="b"/><circle cx="38" cy="400" r="9" fill="#111"/><text x="38" y="404" text-anchor="middle" class="n">5</text><text x="54" y="404" class="s">ESTADO ANTIGO (>45 S)</text>
<text x="44" y="424" class="d">Tudo desativado até chegar estado novo.</text>
<text x="44" y="446" class="d">Mostra quando foi a última atualização.</text>
<rect x="44" y="470" width="500" height="28" rx="8" fill="#fafafa" stroke="#999" stroke-width="1" stroke-dasharray="2 3"/><text x="54" y="488" class="s">sem estado → sem posição, sem botões</text>
<rect x="600" y="386" width="556" height="150" rx="10" class="b"/><circle cx="614" cy="400" r="9" fill="#111"/><text x="614" y="404" text-anchor="middle" class="n">6</text><text x="630" y="404" class="s">COMANDO EM CURSO</text>
<text x="620" y="424" class="d">Um toque = um comando. Enquanto não há Ack,</text>
<text x="620" y="446" class="d">o bloco do movimento fica desativado.</text>
<text x="620" y="472" class="s">ACK OK · ACK RECUSADO · TIMEOUT</text>
<rect x="24" y="556" width="1132" height="130" rx="10" class="b"/><circle cx="38" cy="570" r="9" fill="#111"/><text x="38" y="574" text-anchor="middle" class="n">7</text><text x="54" y="574" class="s">RESULTADO E ERROS</text>
<text x="44" y="594" class="d">OK: discreto, desaparece. Erro: fica com motivo até novo comando.</text>
<text x="44" y="618" class="d">Ack 3 = precisa de Home. Timeout = não repetir sozinho.</text>
<rect x="44" y="636" width="1060" height="28" rx="8" fill="#fafafa" stroke="#999" stroke-width="1" stroke-dasharray="2 3"/><text x="54" y="654" class="s">anúncio para leitores de ecrã, sem bloquear o ecrã</text>
</svg>
