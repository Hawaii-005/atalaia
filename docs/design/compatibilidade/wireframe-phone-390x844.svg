<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" style="background:#ffffff; font-family:sans-serif; color:#222222;">
  <!-- Screen boundary -->
  <rect x="0" y="0" width="390" height="844" fill="#f8f9fa" stroke="#cccccc" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="390" height="60" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
  <text x="20" y="38" font-size="16" font-weight="bold" fill="#333333">[1] ADICIONAR / EDITAR IMPRESSORA</text>
  
  <!-- Content Container -->
  <!-- Block 2: Nome -->
  <rect x="20" y="80" width="350" height="60" fill="#ffffff" stroke="#999999" stroke-width="1" stroke-dasharray="4"/>
  <text x="32" y="102" font-size="12" fill="#666666">[2] NOME DA IMPRESSORA</text>
  <text x="32" y="125" font-size="14" fill="#111111">Centauri Carbon Sala</text>

  <!-- Block 3: Endereço IP -->
  <rect x="20" y="155" width="350" height="60" fill="#ffffff" stroke="#999999" stroke-width="1" stroke-dasharray="4"/>
  <text x="32" y="177" font-size="12" fill="#666666">[3] ENDEREÇO IP (LAN)</text>
  <text x="32" y="200" font-size="14" fill="#111111">192.168.1.150</text>

  <!-- Block 4: IP Alternativo -->
  <rect x="20" y="230" width="350" height="60" fill="#ffffff" stroke="#999999" stroke-width="1" stroke-dasharray="4"/>
  <text x="32" y="252" font-size="12" fill="#666666">[4] ENDEREÇO ALTERNATIVO (TAILSCALE - OPCIONAL)</text>
  <text x="32" y="275" font-size="14" fill="#888888">100.x.y.z</text>

  <!-- Block 5: Seletor de Firmware -->
  <rect x="20" y="305" width="350" height="110" fill="#ffffff" stroke="#666666" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="32" y="327" font-size="12" font-weight="bold" fill="#333333">[5] SELETOR DE FIRMWARE / PROTOCOLO</text>
  <!-- Radio 1: Detetar Auto -->
  <circle cx="40" cy="350" r="6" fill="#444444"/>
  <text x="55" y="354" font-size="13" font-weight="bold" fill="#111111">Detetar automaticamente (Recomendado)</text>
  <!-- Radio 2: SDCP -->
  <circle cx="40" cy="375" r="6" fill="none" stroke="#666666" stroke-width="1.5"/>
  <text x="55" y="379" font-size="13" fill="#444444">Original Elegoo (SDCP :3030)</text>
  <!-- Radio 3: COSMOS -->
  <circle cx="40" cy="400" r="6" fill="none" stroke="#666666" stroke-width="1.5"/>
  <text x="55" y="404" font-size="13" fill="#444444">COSMOS / Klipper (Moonraker :7125)</text>

  <!-- Block 6: Botão Testar Ligação -->
  <rect x="20" y="430" width="350" height="48" rx="8" fill="#e9ecef" stroke="#666666" stroke-width="1"/>
  <text x="125" y="460" font-size="14" font-weight="bold" fill="#222222">[6] TESTAR LIGAÇÃO</text>

  <!-- Block 7: Painel Resultado do Teste -->
  <rect x="20" y="495" width="350" height="120" rx="8" fill="#ffffff" stroke="#444444" stroke-width="1.5" stroke-dasharray="5"/>
  <text x="32" y="520" font-size="12" font-weight="bold" fill="#222222">[7] RESULTADO DO TESTE</text>
  <text x="32" y="542" font-size="13" fill="#2b8a3e">✔ Ligado com sucesso via Moonraker (:7125)</text>
  <text x="32" y="562" font-size="12" fill="#555555">• Servidor: Moonraker v0.8.0 / Klippy v0.12.0</text>
  <text x="32" y="580" font-size="12" fill="#555555">• Latência: 14 ms (LAN)</text>
  <text x="32" y="598" font-size="11" fill="#777777">• Autenticação: Confiada (Trusted Client)</text>

  <!-- Block 8: Aviso Funcionalidade Indisponível / Capacidades -->
  <rect x="20" y="630" width="350" height="90" rx="8" fill="#fff9db" stroke="#f08c00" stroke-width="1" stroke-dasharray="3"/>
  <text x="32" y="652" font-size="12" font-weight="bold" fill="#b06200">[8] ESTADO DE CAPACIDADES DO FIRMWARE</text>
  <text x="32" y="674" font-size="12" fill="#794400">• Consola G-code e Baby-stepping: Ativos</text>
  <text x="32" y="694" font-size="12" fill="#794400">• Gravação de Timelapse SDCP nativo: Indisponível no COSMOS</text>

  <!-- Block 9: Botões Guardar / Cancelar -->
  <rect x="20" y="750" width="165" height="48" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1"/>
  <text x="75" y="780" font-size="14" fill="#555555">CANCELAR</text>

  <rect x="205" y="750" width="165" height="48" rx="8" fill="#222222" rx="8"/>
  <text x="250" y="780" font-size="14" font-weight="bold" fill="#ffffff">[9] GUARDAR</text>
</svg>
