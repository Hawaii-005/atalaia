apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

android {
    namespace "io.github.hawaii005.atalaia.slicer"
    compileSdk 35

    defaultConfig {
        // minSdk da app (24) < do motor nativo (28); a edição 'completa' nunca corre
        // em API < 28, mas o merger valida mesmo assim na variante debug.
        minSdk 24
        consumerProguardFiles "consumer-rules.pro"
    }
    // minSdk igual ao da app: o binário só é carregado em runtime por SlicerEngine,
    // que devolve false se o .so não existir para a ABI do aparelho.
    lint {
        disable "ExpiredTargetSdkVersion"
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main {
            // libslice_core.so é compilado fora do Gradle (Dockerfile + docker-build.sh do CI)
            // e colocado em src/main/jniLibs/arm64-v8a/ pelo workflow.
            jniLibs.srcDirs = ["src/main/jniLibs"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
}
