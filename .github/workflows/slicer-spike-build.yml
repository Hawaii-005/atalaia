name: Slicer Spike - Build & Verify

on:
  workflow_dispatch:

jobs:
  build-native:
    name: Compilar NDK .so e Auditar Símbolos JNI
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout repositório Atalaia
        uses: actions/checkout@v4

      - name: Libertar espaço em disco no Runner (~40 GB livres)
        run: |
          echo "=== Espaço em disco antes da limpeza ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache
          sudo docker image prune -a -f || true
          echo "=== Espaço em disco após limpeza ==="
          df -h

      - name: Construir imagem Docker do compilador NDK r27
        run: |
          cd atalaia-slicer-spike
          docker build -t atalaia-slicer-builder:latest .

      - name: Executar compilação do libslice_core.so
        run: |
          mkdir -p atalaia-slicer-spike/output/arm64-v8a
          docker run --rm \
            -v "$(pwd)/atalaia-slicer-spike/output:/workspace/output" \
            atalaia-slicer-builder:latest

      - name: Validação Estrita de Arquitetura AArch64 e Símbolos JNI
        run: |
          SO_FILE="atalaia-slicer-spike/output/arm64-v8a/libslice_core.so"
          if [ ! -f "$SO_FILE" ]; then
            echo "ERRO CRÍTICO: Ficheiro $SO_FILE não existe!" >&2
            exit 1
          fi

          echo "=== Validação do Formato ELF e Arquitetura AArch64 ==="
          FILE_INFO=$(file "$SO_FILE")
          echo "$FILE_INFO"
          if ! echo "$FILE_INFO" | grep -q "ARM aarch64"; then
            echo "ERRO CRÍTICO: O binário compilado não é ARM aarch64!" >&2
            exit 1
          fi

          echo "=== Verificação Dynamic Section (readelf -d) ==="
          readelf -d "$SO_FILE"

          echo "=== Verificação Estrita de Funções JNI do NativeLib.kt ==="
          KT_FILE="atalaia-slicer-spike/app/src/main/java/world/yemyat/slicepilot/NativeLib.kt"
          if [ ! -f "$KT_FILE" ]; then
            echo "ERRO CRÍTICO: $KT_FILE não encontrado!" >&2
            exit 1
          fi

          # Extrair todas as declarações external fun do Kotlin
          EXTERNAL_FUNS=$(grep -E "external fun" "$KT_FILE" | sed -E 's/.*external fun ([a-zA-Z0-9_]+).*/\1/')
          
          # Extrair todos os símbolos definidos exportados pelo .so
          EXPORTED_SYMBOLS=$(nm -D --defined-only "$SO_FILE")

          MISSING_COUNT=0
          CHECKED_COUNT=0
          for fn in $EXTERNAL_FUNS; do
            EXPECTED_SYM="Java_world_yemyat_slicepilot_NativeLib_${fn}"
            CHECKED_COUNT=$((CHECKED_COUNT + 1))
            if echo "$EXPORTED_SYMBOLS" | grep -q "$EXPECTED_SYM"; then
              echo "  [OK] $EXPECTED_SYM"
            else
              echo "  [FALHA] Símbolo obrigatório AUSENTE no .so: $EXPECTED_SYM" >&2
              MISSING_COUNT=$((MISSING_COUNT + 1))
            fi
          done

          echo "Total de funções JNI verificadas: $CHECKED_COUNT"
          if [ "$MISSING_COUNT" -gt 0 ]; then
            echo "ERRO CRÍTICO: $MISSING_COUNT símbolos JNI esperados não foram encontrados no binário!" >&2
            exit 1
          fi
          echo "Todos os símbolos JNI foram validados com sucesso!"

      - name: Publicar Binário libslice_core.so como Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libslice-core-arm64
          path: atalaia-slicer-spike/output/arm64-v8a/libslice_core.so
          retention-days: 14

  build-apk:
    name: Montar APK Debug do Spike (com Android SDK preservado)
    needs: build-native
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repositório Atalaia
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Descarregar libslice_core.so compilado
        uses: actions/download-artifact@v4
        with:
          name: libslice-core-arm64
          path: atalaia-slicer-spike/app/src/main/jniLibs/arm64-v8a

      - name: Validar Checksum Oficial do gradle-wrapper.jar
        run: |
          cd atalaia-slicer-spike
          JAR_HASH=$(sha256sum gradle/wrapper/gradle-wrapper.jar | awk '{print $1}')
          EXPECTED_HASH="a8451eeda314d0568b5340498b36edf147a8f0d692c5ff58082d477abe9146e4"
          echo "Hash do gradle-wrapper.jar: $JAR_HASH"
          if [ "$JAR_HASH" != "$EXPECTED_HASH" ]; then
            echo "ERRO DE SEGURANÇA: Checksum do gradle-wrapper.jar difere do hash oficial Gradle 8.2!" >&2
            exit 1
          fi
          echo "gradle-wrapper.jar validado com sucesso contra o hash oficial."

      - name: Montar APK de Debug do Spike com Gradle Wrapper 8.2
        run: |
          cd atalaia-slicer-spike
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar APK de Debug como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: slicer-spike-apk-debug
          path: atalaia-slicer-spike/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
