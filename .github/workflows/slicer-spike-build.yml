name: Slicer Spike - Build & Verify

on:
  workflow_dispatch:

jobs:
  build-native-and-apk:
    name: Compilar NDK .so, Verificar Símbolos JNI e Montar APK Debug
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout repositório Atalaia
        uses: actions/checkout@v4

      - name: Libertar espaço em disco no Runner (~40 GB livres)
        run: |
          echo "=== Espaço em disco antes da limpeza ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache
          sudo docker image prune -a -f || true
          echo "=== Espaço em disco após limpeza ==="
          df -h

      - name: Construir imagem Docker do compilador NDK r27
        run: |
          cd atalaia-slicer-spike
          docker build -t atalaia-slicer-builder:latest .

      - name: Executar compilação do libslice_core.so
        run: |
          mkdir -p atalaia-slicer-spike/output/arm64-v8a
          docker run --rm \
            -v "$(pwd)/atalaia-slicer-spike/output:/workspace/output" \
            atalaia-slicer-builder:latest

      - name: Validação e Auditoria de Símbolos JNI (readelf / nm)
        run: |
          SO_FILE="atalaia-slicer-spike/output/arm64-v8a/libslice_core.so"
          test -f "$SO_FILE"
          echo "=== Informação do Ficheiro ELF ==="
          file "$SO_FILE"
          echo "=== Verificação Dynamic Section (readelf -d) ==="
          readelf -d "$SO_FILE"
          echo "=== Símbolos JNI Definidos (nm -D --defined-only) ==="
          nm -D --defined-only "$SO_FILE" | grep "Java_world_yemyat_slicepilot_NativeLib_" || echo "AVISO: Nenhum símbolo Java_world_yemyat_slicepilot_NativeLib encontrado diretamente."
          echo "=== Todos os símbolos JNI exportados ==="
          nm -D --defined-only "$SO_FILE" | grep "Java_" || true

      - name: Montar APK de Debug do Spike com Gradle
        run: |
          cd atalaia-slicer-spike
          # Inserir o binário compilado no local esperado por jniLibs
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp output/arm64-v8a/libslice_core.so app/src/main/jniLibs/arm64-v8a/libslice_core.so
          
          # Dar permissão de execução ao gradle wrapper
          chmod +x gradlew
          
          # Compilar APK de debug
          ./gradlew assembleDebug --no-daemon

      - name: Publicar Binário .so e APK de Debug como Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slicer-spike-artifacts
          path: |
            atalaia-slicer-spike/output/arm64-v8a/libslice_core.so
            atalaia-slicer-spike/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Espaço em disco final do runner
        run: df -h
